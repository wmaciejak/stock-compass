[project]
name = "stock-compass"
version = "1.0.0"
description = "Local, explainable daily stock research"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pandas>=2.2,<3", "numpy>=2.0,<3", "TA-Lib>=0.6.5,<0.8",
  "yfinance>=0.2.65,<2", "backtesting>=0.6.5,<0.7",
  "pandas-market-calendars>=5,<6", "python-dotenv>=1,<2",
  "pytest>=8,<10", "httpx>=0.28,<1", "openai>=2,<3"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
filterwarnings = ["ignore:.*open trades.*:UserWarning", "ignore:.*overflow.*:RuntimeWarning"]
